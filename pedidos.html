<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Quesadillas San Pedro</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            overflow-x: hidden;
        }

        .navbar-brand img {
            transition: transform 0.5s ease;
        }
        .navbar-brand:hover img {
            transform: rotate(360deg);
        }
        .text-warning { color: #f1c40f !important; }
        .bg-danger { background-color: #e74c3c !important; }

        .btn-danger-custom {
            background-color: #e74c3c;
            border: none;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-danger-custom:hover {
            background-color: #c0392b;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.3);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html#inicio">
            <i class="bi bi-chat-heart-fill text-white fs-3 me-2"></i>
            Quesadillas San Pedro
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto text-uppercase small fw-bold">
                <li class="nav-item"><a class="nav-link" href="index.html#inicio">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="menu.html">Menú</a></li>
                <li class="nav-item"><a class="nav-link active" href="pedidos.html">Pedidos</a></li>
            </ul>
        </div>
    </div>
</nav>

<header class="bg-white py-5 text-center shadow-sm">
    <div class="container" data-aos="fade-down">
        <h1 class="display-4 fw-bold text-warning">Haz tu Pedido</h1>
        <p class="lead text-muted">Llevamos el auténtico sazón de Morelos hasta la puerta de tu casa</p>
    </div>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8" data-aos="fade-up" data-aos-delay="100">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="card-body">
                    <h3 class="fw-bold mb-4 text-center text-dark">Detalles de Envío</h3>

                    <form action="#" method="POST">
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                                <input type="text" class="form-control form-control-lg bg-light border-0" id="nombre" placeholder="Ej. Juan Pérez" required>
                            </div>
                            <div class="col-md-6">
                                <label for="telefono" class="form-label fw-semibold">Teléfono / WhatsApp</label>
                                <input type="tel" class="form-control form-control-lg bg-light border-0" id="telefono" placeholder="10 dígitos" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="direccion" class="form-label fw-semibold">Dirección de Entrega</label>
                            <input type="text" class="form-control form-control-lg bg-light border-0" id="direccion" placeholder="Calle, Número, Colonia, Referencias..." required>
                        </div>

                        <div class="mb-4">
                            <label for="pedido" class="form-label fw-semibold">¿Qué se te antoja?</label>
                            <textarea class="form-control form-control-lg bg-light border-0" id="pedido" rows="4" placeholder="Ej. 2 de Queso, 1 de Tinga, 1 Quesabirria con su consomé..." required></textarea>
                        </div>

                        <div class="mb-5">
                            <label class="form-label fw-semibold">Método de Pago a la Entrega</label>
                            <select class="form-select form-select-lg bg-light border-0" required>
                                <option value="" selected disabled>Selecciona un método...</option>
                                <option value="efectivo">Efectivo</option>
                                <option value="transferencia">Transferencia / SPEI</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-danger-custom btn-lg fw-bold text-uppercase py-3">
                                <i class="bi bi-whatsapp me-2"></i> Enviar Pedido
                            </button>
                            <small class="text-muted text-center mt-3">Al hacer clic, procesaremos tu orden lo más rápido posible.</small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
        <p class="mb-0 opacity-75 small">&copy; 2026 Quesadillas San Pedro. Todos los derechos reservados.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({
        once: true,
        duration: 800
    });
</script>
</body>
</html>
